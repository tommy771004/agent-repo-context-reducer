[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-repo-context-reducer"
version = "1.0.0"
description = "Provider-aware repository context harness for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "tommy771004"}]
keywords = ["ai", "agent", "harness", "context", "token", "repository", "coding-agent", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.scripts]
repo-context = "repo_context.cli:main"

[tool.setuptools.packages.find]
include = ["repo_context*"]
