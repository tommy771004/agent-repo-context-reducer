[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-repo-context-reducer"
version = "2.2.0"
description = "Provider-aware repository context reducer with unified dedup, thin model/control planes, adaptive token economics, sandbox-aware durable runtime execution, and deterministic verification for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "tommy771004"}]
keywords = ["ai", "agent", "harness", "context", "token", "repository", "coding-agent", "fan-in", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.scripts]
repo-context = "repo_context.cli:main"
repo-context-fan-in = "repo_context.fan_in_cli:main"

[tool.setuptools.packages.find]
include = ["repo_context*"]

[tool.setuptools.package-data]
repo_context = ["schemas/*.json"]
